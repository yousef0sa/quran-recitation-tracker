name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they get no secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read the code and comment on the PR; never push.
    permissions:
      contents: read
      pull-requests: write
    env:
      # Only the review itself goes to the Anthropic API: no telemetry or update checks.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: review
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          # Subscription token from `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            You review pull requests for this repository. Report only problems worth a
            maintainer's time: false positives cost more than misses.

            ## Steps
            1. Read the PR title, description and diff:
               `gh pr view ${{ github.event.pull_request.number }}` and
               `gh pr diff ${{ github.event.pull_request.number }}`. Always pass the PR number:
               the checkout is a detached HEAD, so gh cannot infer the PR.
            2. Read the project rules in CLAUDE.md, and any file you need for context
               (Read, Grep, Glob).
            3. List candidate problems. For each one, re-read the code and confirm it is
               real in this diff. Drop anything you cannot confirm.
            4. Skip anything an existing CodeRabbit comment on this PR already raises.
            5. Post what survives.

            ## Flag only
            - Code that will fail: does not compile, wrong logic, crash, broken test.
            - A rule from CLAUDE.md that this diff breaks; quote the rule.
            - Privacy: audio or user data leaving the device, a network call, telemetry,
              an account, a server.
            - Files that must never be committed: audio, models, the corpus,
              spike/recordings/, spike/results/.
            - The audio chunk size changed in one of src/audio.ts, src/live.ts,
              public/audio-processor.js (all under spike/) but not in the other two.

            ## Never flag
            Style or formatting, naming, anything a linter or typecheck catches, subjective
            refactors, missing tests or docs in general, problems that existed before this
            PR (unless marked Pre-existing), or guesses that depend on unlikely inputs.

            ## Severity
            - Important: must be fixed before merge.
            - Nit: worth fixing, not blocking. At most 5; count the rest.
            - Pre-existing: a real bug this PR did not introduce.
            If EVENT is "synchronize", post Important findings only.

            ## Output
            Inline comment, one per problem, on the changed line:
            - First line in bold: severity, category, and the problem in one sentence.
            - Evidence in 1 to 3 sentences, with file:line or the quoted rule.
            - The fix. Use a `suggestion` block only if it fully fixes the problem in a
              few lines; otherwise describe the fix.
            Then one summary comment (`gh pr comment ${{ github.event.pull_request.number }}`). Its first line is the tally, such
            as "1 Important, 2 Nit", or "No blocking issues". Then a short table:
            severity | file:line | problem. End with one line on what you checked.
            No praise, no restating the diff.

            Never quote Quranic text in any comment: refer to words by position.
          claude_args: |
            --model claude-fable-5-1
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Subscription runs are not billed per call; this shows what the run would cost on the API.
      - name: Review cost
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          node -e '
            const messages = JSON.parse(require("fs").readFileSync(process.env.EXECUTION_FILE, "utf8"));
            const r = messages.filter((m) => m.type === "result").pop();
            if (!r) { console.log("No result message in the execution file."); process.exit(0); }
            const denied = (r.permission_denials || []).map((d) => d.tool_name);
            console.log([
              "### Claude review cost",
              "",
              "| | |",
              "|---|---|",
              `| Equivalent API cost | $${(r.total_cost_usd ?? 0).toFixed(2)} |`,
              `| Duration | ${Math.round((r.duration_ms ?? 0) / 1000)} s |`,
              `| Turns | ${r.num_turns ?? "?"} |`,
              `| Models | ${Object.keys(r.modelUsage || {}).join(", ") || "?"} |`,
              `| Denied tool calls | ${denied.length}${denied.length ? " (" + [...new Set(denied)].join(", ") + ")" : ""} |`,
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
